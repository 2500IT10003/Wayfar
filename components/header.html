<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    
</body>
</html>
<header class="site-header">
    <div class="top-bar">
        <div class="header-left">
            <a href="index.html" class="logo">
                <svg class="brand-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
                </svg>
                <span>Wayfar</span>
            </a>
        </div>
        <div class="header-right">
            <a href="#">My orders</a>
            <span class="flag">🇲🇲</span>
            <a href="#" id="loginBtn" class="login-btn">Log in</a>
        </div>
    </div>
</header>

<!-- Login Modal Overlay -->
<div id="loginModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Log in</h2>
            <button class="close-btn" id="closeLoginModal">&times;</button>
        </div>
        
        <div class="modal-body">
            <!-- Phone Number Input Row -->
            <div class="phone-input-row">
                <div class="country-code-select">
                    <span class="flag">🇲🇲</span> +95 ▼
                </div>
                <div class="phone-number-field">
                    <input type="text" id="loginPhone" placeholder="Phone number">
                </div>
            </div>

            <!-- Login Button -->
            <button class="modal-login-btn" id="submitLoginBtn">Log in</button>

            <div class="divider-or">
                <span>or</span>
            </div>

            <!-- Google Login Button -->
            <button class="google-login-btn" id="googleLoginBtn">
                <span class="google-icon">G</span> Continue with Google
            </button>

            <div class="modal-footer-text">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </div>
</header>
