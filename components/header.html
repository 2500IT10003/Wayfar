<header class="site-header">
    <!-- Top Blue Bar -->
    <div class="top-bar">
        <div class="header-left">
            <a href="index.html" class="logo">TransitHub</a>
        </div>
        <div class="header-right">
            <a href="#">My orders</a>
            <span class="flag">🇲🇲</span>
            <a href="#" id="loginBtn" class="login-btn">Log in</a>
        </div>
    </div>
</header>

<!-- Login Modal Overlay -->
<div id="loginModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Log in</h2>
            <button class="close-btn" id="closeLoginModal">&times;</button>
        </div>
        
        <div class="modal-body">
            <!-- Phone Number Input Row -->
            <div class="phone-input-row">
                <div class="country-code-select">
                    <span class="flag">🇲🇲</span> +95 ▼
                </div>
                <div class="phone-number-field">
                    <input type="text" placeholder="Phone number">
                </div>
            </div>

            <!-- Login Button -->
            <button class="modal-login-btn">Log in</button>

            <div class="divider-or">
                <span>or</span>
            </div>

            <!-- Google Login Button -->
            <button class="google-login-btn">
                <span class="google-icon">G</span> Continue with Google
            </button>

            <div class="modal-footer-text">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
