<div class="hero-banner">
    <div class="hero-content">
        <h1>Vietnam domestic bus booking</h1>
        <p>Find the best routes and cheap tickets instantly</p>
        
        <!-- Search Card Box -->
        <div class="search-card">
            <!-- Transport Tabs -->
            <div class="search-tabs">
                <a href="bus.html" class="tab active">Bus</a>
                <a href="flight.html" class="tab">Flight</a>
                <a href="train.html" class="tab">Train</a>
            </div>

            <!-- Search Inputs Form -->
            <div class="search-inputs">
                <div class="input-group">
                    <label>Start point</label>
                    <input type="text" id="startPoint" placeholder="Enter departure city" readonly>
                </div>
                <div class="swap-icon" onclick="swapLocations()">⇄</div>
                <div class="input-group">
                    <label>Destination</label>
                    <input type="text" id="destination" placeholder="Enter destination" readonly>
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="travelDate" class="date-input">
                </div>
                <button class="search-btn">Search</button>
            </div>
        </div>
    </div>
</div>
