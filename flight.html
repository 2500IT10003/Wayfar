<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TransitHub - Flight Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header placeholder (Loads header & login modal automatically) -->
    <div id="header-placeholder"></div>

    <!-- Hero Banner with Flight Tab Active -->
    <div class="hero-banner">
        <div class="hero-content">
            <h1>Myanmar domestic flight booking</h1>
            <p>Find the best airline routes and cheap tickets instantly</p>
            
            <div class="search-card">
                <div class="search-tabs">
                    <a href="bus.html" class="tab">Bus</a>
                    <a href="flight.html" class="tab active">Flight</a>
                    <a href="train.html" class="tab">Train</a>
                </div>
                <div class="search-inputs">
                    <div class="input-group">
                        <label>Start point</label>
                        <input type="text" placeholder="Enter departure city/airport">
                    </div>
                    <div class="swap-icon">⇄</div>
                    <div class="input-group">
                        <label>Destination</label>
                        <input type="text" placeholder="Enter destination city/airport">
                    </div>
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date">
                    </div>
                    <button class="search-btn">Search</button>
                </div>
            </div>
        </div>
    </div>

    <!-- === Main Content (Custom per page) === -->
    <main class="main-content">
        <!-- Team member can add flight-specific sections, tables, or cards here -->
    </main>

    <!-- Footer placeholder (Loads shared footer and destination links) -->
    <div id="footer-placeholder"></div>
    
    <!-- Scripts -->
    <script src="js/load-components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
