<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TransitHub - Train Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header placeholder (Loads header & login modal automatically) -->
    <div id="header-placeholder"></div>

    <!-- Hero Banner with Train Tab Active -->
    <div class="hero-banner">
        <div class="hero-content">
            <h1>Myanmar railway and train booking</h1>
            <p>Explore scenic rail routes and book your tickets easily</p>
            
            <div class="search-card">
                <div class="search-tabs">
                    <a href="bus.html" class="tab">Bus</a>
                    <a href="flight.html" class="tab">Flight</a>
                    <a href="train.html" class="tab active">Train</a>
                </div>
                <div class="search-inputs">
                    <div class="input-group">
                        <label>Start point</label>
                        <input type="text" placeholder="Enter departure station/city">
                    </div>
                    <div class="swap-icon">⇄</div>
                    <div class="input-group">
                        <label>Destination</label>
                        <input type="text" placeholder="Enter arrival station/city">
                    </div>
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date">
                    </div>
                    <button class="search-btn">Search</button>
                </div>
            </div>
        </div>
    </div>

    <!-- === Main Content (Custom per page) === -->
    <main class="main-content">
        <!-- Team member can add train-specific sections, schedules, or cards here -->
    </main>

    <!-- Footer placeholder (Loads shared footer and destination links) -->
    <div id="footer-placeholder"></div>
    
    <!-- Scripts -->
    <script src="js/load-components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
