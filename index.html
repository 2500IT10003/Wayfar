<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitHub - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header placeholder (Automatically loads components/header.html and login modal) -->
    <div id="header-placeholder"></div>

    <!-- Search Banner (Hero section with Bus tab active) -->
    <div class="hero-banner">
        <div class="hero-content">
            <h1>Myanmar domestic bus booking</h1>
            <p>Find the best routes and cheap tickets instantly</p>
            
            <div class="search-card">
                <div class="search-tabs">
                    <a href="index.html" class="tab active">Bus</a>
                    <a href="flight.html" class="tab">Flight</a>
                    <a href="train.html" class="tab">Train</a>
                </div>
                <div class="search-inputs">
                    <div class="input-group">
                        <label>Start point</label>
                        <input type="text" placeholder="Enter departure city">
                    </div>
                    <div class="swap-icon">⇄</div>
                    <div class="input-group">
                        <label>Destination</label>
                        <input type="text" placeholder="Enter destination">
                    </div>
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date">
                    </div>
                    <button class="search-btn">Search</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content for Home -->
    <main class="main-content">
        <!-- Your homepage cards/sections go here -->
    </main>

    <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/load-components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
